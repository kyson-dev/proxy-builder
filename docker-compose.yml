services:
  sing-box:
    image: ${SING_BOX_IMAGE:?SING_BOX_IMAGE must be a digest reference}
    container_name: proxy-builder-sing-box
    restart: unless-stopped
    command: ["run", "-c", "/etc/sing-box/config.json"]
    ports:
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - "${PROXY_ROOT:-/opt/proxy-builder}/current/config.json:/etc/sing-box/config.json:ro"
      - "${PROXY_ROOT:-/opt/proxy-builder}/secrets:/etc/sing-box/cert:ro"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
