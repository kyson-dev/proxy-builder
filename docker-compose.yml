services:
  sing-box:
    image: ghcr.io/sagernet/sing-box:v1.13.14
    container_name: sing-box
    hostname: sing-box
    restart: unless-stopped
    tty: true
    command: run -c /etc/sing-box/config.json
    ports:
      # 443 端口用于代理流量（VLESS 和 Hysteria2 同端口多路）
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ${DATA_ROOT}/config.json:/etc/sing-box/config.json
      - ${DATA_ROOT}/cert:/etc/sing-box/cert

  subscription:
    image: ${SUBSCRIPTION_IMAGE}
    container_name: subscription
    restart: unless-stopped
    ports:
      # 订阅服务端口（仅供拉取订阅使用，非代理流量）
      - "8080:8080/tcp"
    volumes:
      - ${DATA_ROOT}/users.json:/etc/sing-box/users.json:ro
      # 只读挂载证书，供订阅服务计算 pinSHA256 指纹下发给客户端
      - ${DATA_ROOT}/cert:/etc/sing-box/cert:ro
    environment:
      - REALITY_PUBLIC_KEY=${REALITY_PUBLIC_KEY}
      - REALITY_SHORT_ID=${REALITY_SHORT_ID}
      - REALITY_DEST=${REALITY_DEST}
      - HY2_SNI=${HY2_SNI:-www.bing.com}
      - OBFS_PASSWORD=${OBFS_PASSWORD:-}
