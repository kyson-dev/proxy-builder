name: Deploy application

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [development, production]
      git_ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: proxy-builder-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Resolve immutable commit and enforce guard
        id: revision
        env:
          PRODUCTION_OPERATIONS_ENABLED: ${{ vars.PRODUCTION_OPERATIONS_ENABLED }}
        run: |
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          scripts/delivery/guard-operation.sh "${{ inputs.environment }}" "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ inputs.environment == 'production' && vars.PROD_GCP_WIF_PROVIDER || vars.DEV_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
      - name: Read platform deployment context
        id: platform
        env:
          ENV: ${{ inputs.environment }}
        run: scripts/delivery/platform-context.sh
      - name: Configure registry authentication
        run: gcloud auth configure-docker "${{ steps.platform.outputs.region }}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push subscription image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/subscription/Dockerfile
          push: true
          tags: ${{ steps.platform.outputs.artifact_repository_url }}/subscription:${{ steps.revision.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: false
          sbom: false
      - name: Deploy VM then Cloud Run
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          GIT_SHA: ${{ steps.revision.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IMAGE_DIGEST: ${{ steps.platform.outputs.artifact_repository_url }}/subscription@${{ steps.image.outputs.digest }}
          GCP_PROJECT_ID: ${{ steps.platform.outputs.project_id }}
          GCP_REGION: ${{ steps.platform.outputs.region }}
          GCP_VM_NAME: ${{ steps.platform.outputs.proxy_vm_name }}
          GCP_VM_ZONE: ${{ steps.platform.outputs.proxy_vm_zone }}
          SUBSCRIPTION_SERVICE_NAME: ${{ steps.platform.outputs.subscription_service_name }}
          PROXY_IP: ${{ steps.platform.outputs.proxy_ip_address }}
          PROXY_USERS_SECRET_ID: ${{ steps.platform.outputs.proxy_users_secret_id }}
          OBFS_PASSWORD_SECRET_ID: ${{ steps.platform.outputs.obfs_password_secret_id }}
          REALITY_PRIVATE_KEY: ${{ secrets.REALITY_PRIVATE_KEY }}
          OBFS_PASSWORD: ${{ secrets.OBFS_PASSWORD }}
          HY2_CERT_PEM: ${{ secrets.HY2_CERT_PEM }}
          HY2_KEY_PEM: ${{ secrets.HY2_KEY_PEM }}
          PROXY_USERS_JSON: ${{ secrets.PROXY_USERS_JSON }}
        run: scripts/delivery/deploy.sh
