name: Deploy to GCP VM

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "beta"

      - name: Deploy
        timeout-minutes: 10
        run: |
          # 加载单一数据源全局路径定义
          source scripts/lib/paths.sh

          VM="${{ secrets.GCP_VM_NAME }}"
          ZONE="${{ secrets.GCP_VM_ZONE }}"

          # 1. 创建 .env 文件
          echo "📝 创建环境配置..."
          cat > .env << EOF
          REALITY_PRIVATE_KEY=${{ secrets.REALITY_PRIVATE_KEY }}
          REALITY_PUBLIC_KEY=${{ secrets.REALITY_PUBLIC_KEY }}
          REALITY_SHORT_ID=${{ secrets.REALITY_SHORT_ID }}
          REALITY_DEST=${{ secrets.REALITY_DEST }}
          EOF

          # 将 users secret 写为 json 文件
          echo "📝 生成用户配置 users.json..."
          cat > users.json << 'USERS_EOF'
          ${{ secrets.USERS_JSON }}
          USERS_EOF

          # 2. 打包
          echo "📦 打包文件..."
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='vars.*.json' \
              --exclude='*.md' \
              --exclude='docs' \
              --exclude='.env.*' \
              -czf /tmp/app.tar.gz .

          # 3. 上传到虚拟机临时目录
          echo "📤 上传文件..."
          gcloud beta compute scp /tmp/app.tar.gz ${VM}:/tmp/app.tar.gz --zone=${ZONE} --quiet

          # 4. 部署
          echo "🚀 执行部署..."
          gcloud beta compute ssh ${VM} --zone=${ZONE} --quiet --command='
            set -e
            
            # 从上传的压缩包中提取路径定义，以此作为虚拟机执行的唯一路径数据源
            tar -xzf /tmp/app.tar.gz -C /tmp scripts/lib/paths.sh
            source /tmp/scripts/lib/paths.sh
            rm -rf /tmp/scripts
            
            # 停止当前服务（如果存在）
            if [ -d "$APP_DIR" ] && [ -f "$APP_DIR/docker-compose.yml" ]; then
              echo "⏸️  停止当前服务..."
              cd "$APP_DIR"
              docker compose down 2>/dev/null || true
            fi
            
            # ==================================================================
            # 备份：代码目录 + 数据目录 同时快照
            # 确保回滚时两者能完整还原到同一版本
            # ==================================================================
            echo "💾 备份当前版本..."
            rm -rf "${APP_DIR}.backup"
            rm -rf "${SING_BOX_DATA_DIR}.backup"
            
            [ -d "$APP_DIR" ] && mv "$APP_DIR" "${APP_DIR}.backup"
            [ -d "${SING_BOX_DATA_DIR}" ] && cp -r "${SING_BOX_DATA_DIR}" "${SING_BOX_DATA_DIR}.backup" || true
            
            # 解压新版本到统一的应用目录
            echo "📦 解压新版本..."
            mkdir -p "$APP_DIR"
            tar -xzf /tmp/app.tar.gz -C "$APP_DIR"
            rm -f /tmp/app.tar.gz
            
            # 检测是否需要运行主机初始化 (provision)
            NEED_PROVISION=false
            if ! command -v docker &>/dev/null; then
              NEED_PROVISION=true
            elif [ ! -f /etc/docker/daemon.json ]; then
              NEED_PROVISION=true
            elif [ ! -f /etc/google-cloud-ops-agent/config.yaml ] || ! grep -q "systemd_journald" /etc/google-cloud-ops-agent/config.yaml; then
              NEED_PROVISION=true
            elif [ ! -d "$DATA_DIR" ] || [ "$(stat -c %G "$DATA_DIR" 2>/dev/null)" != "docker" ]; then
              NEED_PROVISION=true
            fi

            if [ "$NEED_PROVISION" = "true" ]; then
              echo "🔧 检测到主机环境不完整，正在自动执行主机供给 (provision.sh)..."
              chmod +x "${APP_DIR}/provision.sh"
              sudo "${APP_DIR}/provision.sh"
            else
              echo "✅ 检测到主机环境已就绪，跳过主机供给步骤"
            fi
            
            # 部署新版本
            echo "🚀 部署新版本..."
            cd "$APP_DIR"
            chmod +x deploy.sh
            
            if ./deploy.sh; then
              echo "✅ 部署成功"
              
              # 清理备份（代码 + 数据）
              echo "🧹 清理备份..."
              rm -rf "${APP_DIR}.backup"
              rm -rf "${SING_BOX_DATA_DIR}.backup" || true
              
              echo "✅ 部署完成"
            else
              echo "❌ 部署失败，开始回滚..."
              
              # ==============================================================
              # 回滚：代码目录 + 数据目录 一起还原
              # ==============================================================
              rm -rf "$APP_DIR"
              [ -d "${APP_DIR}.backup" ] && mv "${APP_DIR}.backup" "$APP_DIR" || echo "⚠️ 无代码备份"
              
              rm -rf "${SING_BOX_DATA_DIR}" || true
              if [ -d "${SING_BOX_DATA_DIR}.backup" ]; then
                mv "${SING_BOX_DATA_DIR}.backup" "${SING_BOX_DATA_DIR}"
                echo "✅ 数据目录已回滚"
              else
                echo "⚠️ 无数据备份，跳过数据回滚"
              fi
              
              # 用旧代码 + 旧数据重启服务
              if [ -d "$APP_DIR" ]; then
                cd "$APP_DIR"
                docker compose up -d 2>/dev/null || echo "⚠️ 旧版本重启失败"
                echo "✅ 已恢复到旧版本"
              fi
              
              exit 1
            fi
          '

          echo "✅ 部署完成"
