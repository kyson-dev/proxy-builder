name: Deploy to GCP VM

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "beta"

      - name: Deploy
        timeout-minutes: 15
        run: |
          set -euo pipefail

          VM="${{ secrets.GCP_VM_NAME }}"
          ZONE="${{ secrets.GCP_VM_ZONE }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT" ]; then
            PROJECT="$(gcloud config get-value project 2>/dev/null)"
          fi
          if [ -z "$PROJECT" ]; then
            echo "❌ GCP_PROJECT_ID is not set and gcloud has no active project"
            exit 1
          fi

          BUCKET="${PROJECT}-proxy-deploy"
          OBJECT="deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            echo "🧹 清理临时部署包..."
            gcloud storage rm "gs://${BUCKET}/${OBJECT}" --quiet 2>/dev/null || true
          }
          trap cleanup EXIT

          # 1. 创建 .env 文件
          echo "📝 创建环境配置..."
          cat > .env << EOF
          REALITY_PRIVATE_KEY=${{ secrets.REALITY_PRIVATE_KEY }}
          REALITY_PUBLIC_KEY=${{ secrets.REALITY_PUBLIC_KEY }}
          REALITY_SHORT_ID=${{ secrets.REALITY_SHORT_ID }}
          REALITY_DEST=${{ secrets.REALITY_DEST }}
          EOF

          # 将 users secret 写为 json 文件
          echo "📝 生成用户配置 users.json..."
          cat > users.json << 'USERS_EOF'
          ${{ secrets.USERS_JSON }}
          USERS_EOF

          # 2. 打包
          echo "📦 打包文件..."
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='vars.*.json' \
              --exclude='*.md' \
              --exclude='docs' \
              --exclude='.env.*' \
              -czf /tmp/app.tar.gz .

          # 3. 上传到 GCS 临时部署包
          echo "🪣 准备 GCS 部署桶..."
          if ! gcloud storage buckets describe "gs://${BUCKET}" --project="${PROJECT}" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${BUCKET}" \
              --project="${PROJECT}" \
              --location=US \
              --uniform-bucket-level-access
          fi

          VM_SERVICE_ACCOUNT="$(gcloud compute instances describe "${VM}" \
            --project="${PROJECT}" \
            --zone="${ZONE}" \
            --format='value(serviceAccounts[0].email)')"
          if [ -z "$VM_SERVICE_ACCOUNT" ]; then
            echo "❌ VM does not have a service account; cannot download deployment package without SSH"
            exit 1
          fi

          echo "🔐 授权 VM service account 读取部署包..."
          gcloud storage buckets add-iam-policy-binding "gs://${BUCKET}" \
            --member="serviceAccount:${VM_SERVICE_ACCOUNT}" \
            --role="roles/storage.objectViewer" \
            --quiet >/dev/null

          echo "📤 上传部署包: gs://${BUCKET}/${OBJECT}"
          gcloud storage cp /tmp/app.tar.gz "gs://${BUCKET}/${OBJECT}" --quiet

          # 4. 注入 startup-script 并重启 VM，让 VM 自己完成部署
          echo "🚀 注入 startup-script 并重启 VM..."
          gcloud compute instances add-metadata "${VM}" \
            --project="${PROJECT}" \
            --zone="${ZONE}" \
            --metadata-from-file startup-script=scripts/gcp/bootstrap-deploy.sh \
            --metadata proxy-deploy-bucket="${BUCKET}",proxy-deploy-object="${OBJECT}",proxy-deploy-run-id="${RUN_ID}"

          gcloud compute instances stop "${VM}" \
            --project="${PROJECT}" \
            --zone="${ZONE}" \
            --quiet

          gcloud compute instances start "${VM}" \
            --project="${PROJECT}" \
            --zone="${ZONE}" \
            --quiet

          # 5. 轮询串口日志，确认 startup-script 部署结果
          echo "⏳ 等待 VM 自举部署完成..."
          deadline=$((SECONDS + 600))

          # 增量读取串口日志：记录上次读取位置，避免重复扫描历史日志
          serial_offset=0
          # 已积累的日志内容（用于在已启动标记出现后继续搜索结果）
          accumulated=""
          # 0=未出现本次运行标记 1=已出现
          seen_run_marker=0

          # 暂时关闭 set -e，允许轮询期间 gcloud 命令因虚拟机未完全开机而返回瞬态错误
          set +e

          while [ "$SECONDS" -lt "$deadline" ]; do
            # 增量读取，--start 使用字节偏移量
            new_output="$(gcloud compute instances get-serial-port-output "${VM}" \
              --project="${PROJECT}" \
              --zone="${ZONE}" \
              --start="${serial_offset}" \
              --port=1 2>/dev/null)"

            if [ -n "$new_output" ]; then
              # 读取返回的 next 偏移量（最后一行为 next-start 注释）
              next_offset="$(printf '%s\n' "$new_output" | grep '^\[' | tail -1 | sed -n 's/.*next-start: \([0-9]*\).*/\1/p')"
              [ -n "$next_offset" ] && serial_offset="$next_offset"
              accumulated="${accumulated}${new_output}"
            fi

            # 阶段1：等待本次运行的启动标记出现（排除历史残留日志干扰）
            if [ "$seen_run_marker" -eq 0 ]; then
              if [[ "$accumulated" == *"Deploy run: ${RUN_ID}"* ]]; then
                seen_run_marker=1
                echo "📍 正在运行的部署已确认启动"
              fi
            fi

            # 阶段2：在已确认本次运行后，检查结果
            if [ "$seen_run_marker" -eq 1 ]; then
              # 截取当前运行标记之后的日志内容，防止历史残留日志干扰判定
              current_run_log="${accumulated#*Deploy run: ${RUN_ID}}"

              if [[ "$current_run_log" == *"Proxy bootstrap finished"* ]]; then
                echo "✅ VM 自举部署成功"
                echo "📝 部署执行日志与订阅链接："
                printf '%s\n' "Deploy run: ${RUN_ID}${current_run_log}"
                # 恢复严格模式并退出
                set -e
                break
              fi
              if [[ "$current_run_log" == *"Deployment failed"* ]]; then
                echo "❌ VM 自举部署失败"
                printf '%s\n' "Deploy run: ${RUN_ID}${current_run_log}" | tail -n 120
                set -e
                exit 1
              fi
            fi

            sleep 10
          done

          # 确保如果因超时退出循环，恢复严格模式
          set -e

          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "❌ 等待 VM 自举部署超时"
            printf '%s\n' "$accumulated" | tail -n 160
            exit 1
          fi

          echo "✅ 部署完成"
