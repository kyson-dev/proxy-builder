name: Deploy to GCP VM

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "beta"

      - name: Deploy
        timeout-minutes: 15
        run: |
          set -euo pipefail

          VM="${{ secrets.GCP_VM_NAME }}"
          ZONE="${{ secrets.GCP_VM_ZONE }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT" ]; then
            PROJECT="$(gcloud config get-value project 2>/dev/null)"
          fi
          if [ -z "$PROJECT" ]; then
            echo "❌ GCP_PROJECT_ID is not set and gcloud has no active project"
            exit 1
          fi

          BUCKET="${PROJECT}-proxy-deploy"
          OBJECT="deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            echo "🧹 清理临时部署包..."
            gcloud storage rm "gs://${BUCKET}/${OBJECT}" --quiet 2>/dev/null || true
          }
          trap cleanup EXIT

          # 1. 创建 .env 文件
          echo "📝 创建环境配置..."
          cat > .env << EOF
          REALITY_PRIVATE_KEY=${{ secrets.REALITY_PRIVATE_KEY }}
          REALITY_PUBLIC_KEY=${{ secrets.REALITY_PUBLIC_KEY }}
          REALITY_SHORT_ID=${{ secrets.REALITY_SHORT_ID }}
          REALITY_DEST=${{ secrets.REALITY_DEST }}
          EOF

          # 将 users secret 写为 json 文件
          echo "📝 生成用户配置 users.json..."
          cat > users.json << 'USERS_EOF'
          ${{ secrets.USERS_JSON }}
          USERS_EOF

          # 2. 打包
          echo "📦 打包文件..."
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='vars.*.json' \
              --exclude='*.md' \
              --exclude='docs' \
              --exclude='.env.*' \
              -czf /tmp/app.tar.gz .

          # 3. 上传到 GCS 临时部署包
          echo "🪣 准备 GCS 部署桶..."
          if ! gcloud storage buckets describe "gs://${BUCKET}" --project="${PROJECT}" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${BUCKET}" \
              --project="${PROJECT}" \
              --location=US \
              --uniform-bucket-level-access
          fi

          VM_SERVICE_ACCOUNT="$(gcloud compute instances describe "${VM}" \
            --project="${PROJECT}" \
            --zone="${ZONE}" \
            --format='value(serviceAccounts[0].email)')"
          if [ -z "$VM_SERVICE_ACCOUNT" ]; then
            echo "❌ VM does not have a service account; cannot download deployment package without SSH"
            exit 1
          fi

          echo "🔐 授权 VM service account 读写部署桶..."
          gcloud storage buckets add-iam-policy-binding "gs://${BUCKET}" \
            --member="serviceAccount:${VM_SERVICE_ACCOUNT}" \
            --role="roles/storage.objectAdmin" \
            --quiet >/dev/null

          echo "📤 上传部署包: gs://${BUCKET}/${OBJECT}"
          gcloud storage cp /tmp/app.tar.gz "gs://${BUCKET}/${OBJECT}" --quiet

          # 4. 注入 startup-script 并重启 VM，让 VM 自己完成部署
          echo "🚀 注入 startup-script 并重启 VM..."
          gcloud compute instances add-metadata "${VM}" \
            --project="${PROJECT}" \
            --zone="${ZONE}" \
            --metadata-from-file startup-script=scripts/gcp/bootstrap-deploy.sh \
            --metadata proxy-deploy-bucket="${BUCKET}",proxy-deploy-object="${OBJECT}",proxy-deploy-run-id="${RUN_ID}"

          gcloud compute instances stop "${VM}" \
            --project="${PROJECT}" \
            --zone="${ZONE}" \
            --quiet

          gcloud compute instances start "${VM}" \
            --project="${PROJECT}" \
            --zone="${ZONE}" \
            --quiet

          # 5. 轮询 GCS，等待自举部署结果文件出现
          echo "⏳ 等待 GCS 部署结果文件..."
          deadline=$((SECONDS + 600))
          result_status=""

          # 暂时关闭 set -e，允许 gcloud 探针由于网络或暂时未开机而返回非零状态码
          set +e
          while [ "$SECONDS" -lt "$deadline" ]; do
            # 1. 探测是否存在成功标记文件
            if gcloud storage objects describe "gs://${BUCKET}/deploy-${RUN_ID}-success.log" &>/dev/null; then
              result_status="success"
              break
            fi

            # 2. 探测是否存在失败标记文件
            if gcloud storage objects describe "gs://${BUCKET}/deploy-${RUN_ID}-failed.log" &>/dev/null; then
              result_status="failed"
              break
            fi

            sleep 10
          done
          set -e

          # 6. 处理部署输出
          if [ "$result_status" = "success" ]; then
            echo "✅ VM 自举部署成功"
            echo "📝 部署执行日志与订阅链接："
            gcloud storage cat "gs://${BUCKET}/deploy-${RUN_ID}-success.log"
            # 清理 GCS 上的临时状态日志文件
            gcloud storage rm "gs://${BUCKET}/deploy-${RUN_ID}-success.log" --quiet &>/dev/null || true
          elif [ "$result_status" = "failed" ]; then
            echo "❌ VM 自举部署失败"
            echo "📝 部署失败日志与回滚状态："
            gcloud storage cat "gs://${BUCKET}/deploy-${RUN_ID}-failed.log" | tail -n 120
            # 清理 GCS 上的临时状态日志文件
            gcloud storage rm "gs://${BUCKET}/deploy-${RUN_ID}-failed.log" --quiet &>/dev/null || true
            exit 1
          else
            echo "❌ 等待 VM 自举部署超时（10分钟）"
            exit 1
          fi

          echo "✅ 部署完成"
