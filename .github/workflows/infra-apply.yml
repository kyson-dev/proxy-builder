name: Infrastructure apply

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [development, production]
      stack:
        required: true
        type: choice
        options: [bootstrap, platform]

permissions:
  contents: read

concurrency:
  group: proxy-builder-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce operation guard
        env:
          PRODUCTION_OPERATIONS_ENABLED: ${{ vars.PRODUCTION_OPERATIONS_ENABLED }}
        run: scripts/delivery/guard-operation.sh "${{ inputs.environment }}"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ inputs.environment == 'production' && vars.PROD_GCP_WIF_PROVIDER || vars.DEV_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.1
      - name: Regenerate plan and apply
        run: make infra-apply ENV="${{ inputs.environment }}" STACK="${{ inputs.stack }}"

