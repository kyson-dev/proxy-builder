name: Deploy to Emergency VM (Backup / Spot)

on:
  workflow_dispatch:
    inputs:
      vm_name:
        description: "目标 VM 名称（留空则使用 proxy-vm-backup）"
        required: false
        type: string
      zone:
        description: "GCE 区域（留空则使用当前环境的 GCP_VM_ZONE, 可使用seoul区域 asia-northeast3-a）"
        required: false
        type: string
      machine_type:
        description: "机器类型（留空则使用 e2-micro）"
        required: false
        type: string
      disk_size:
        description: "磁盘大小 GB（留空则使用 10，最小 10）"
        required: false
        type: string
      spot:
        description: "是否使用 Spot 实例（更便宜，但可能被 GCP 随时回收）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: subscription
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================================================
  # Job 1: 确保目标应急 VM 存在（幂等，若已存在则跳过创建）
  # ============================================================================
  ensure-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "beta"

      - name: 创建/复用应急 VM
        env:
          VM_ZONE: ${{ inputs.zone || secrets.GCP_VM_ZONE }}
          VM_NAME: ${{ inputs.vm_name || 'proxy-vm-backup' }}
        run: |
          source scripts/lib/common.sh
          source scripts/lib/gcp.sh
          source scripts/setup/modules/infra-vm.sh

          infra::create_vm \
            "${{ secrets.GCP_PROJECT_ID }}" "${VM_NAME}" \
            "${VM_ZONE}" "proxy-vm-sa" \
            "${{ inputs.machine_type || 'e2-micro' }}" \
            "${{ inputs.disk_size || '10' }}" "pd-standard" "STANDARD" \
            "${{ inputs.spot }}"

          infra::ensure_vm_oslogin \
            "${{ secrets.GCP_PROJECT_ID }}" "${VM_NAME}" \
            "${VM_ZONE}"

  # ============================================================================
  # Job 2: 构建 sub 镜像并推送到 Artifact Registry
  # ============================================================================
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_AR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push subscription image
        id: meta
        env:
          AR_IMAGE: ${{ secrets.GCP_AR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPOSITORY }}/${{ env.IMAGE_NAME }}
        run: |
          docker build \
            -t "${AR_IMAGE}:${{ env.IMAGE_TAG }}" \
            -f services/${{ env.IMAGE_NAME }}/Dockerfile \
            services/${{ env.IMAGE_NAME }}/

          docker push "${AR_IMAGE}:${{ env.IMAGE_TAG }}"

          echo "image=${AR_IMAGE}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
          echo "✅ 镜像已推送: ${AR_IMAGE}:${{ env.IMAGE_TAG }}"

  # ============================================================================
  # Job 3: 将精简包部署到目标应急 VM
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ensure-vm, build-and-push]
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "beta"

      - name: Deploy
        timeout-minutes: 10
        env:
          SUBSCRIPTION_IMAGE: ${{ secrets.GCP_AR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          VM_ZONE: ${{ inputs.zone || secrets.GCP_VM_ZONE }}
          VM_NAME: ${{ inputs.vm_name || 'proxy-vm-backup' }}
        run: |
          # 加载单一数据源全局路径定义
          source scripts/lib/paths.sh

          VM="${VM_NAME}"
          ZONE="${VM_ZONE}"

          # 1. 创建 .env 文件（注入 secrets + 镜像地址）
          echo "📝 创建环境配置..."
          cat > .env << EOF
          REALITY_PRIVATE_KEY=${{ secrets.REALITY_PRIVATE_KEY }}
          REALITY_PUBLIC_KEY=${{ secrets.REALITY_PUBLIC_KEY }}
          REALITY_SHORT_ID=${{ secrets.REALITY_SHORT_ID }}
          REALITY_DEST=${{ secrets.REALITY_DEST }}
          SUBSCRIPTION_IMAGE=${SUBSCRIPTION_IMAGE}
          EOF

          # 将 users secret 写为 json 文件
          echo "📝 生成用户配置 users.json..."
          cat > users.json << 'USERS_EOF'
          ${{ secrets.USERS_JSON }}
          USERS_EOF

          # 2. 打包精简包（白名单：仅包含运行所需文件，排除源码与开发产物）
          echo "📦 打包文件..."
          tar -czf /tmp/app.tar.gz \
              .env \
              users.json \
              docker-compose.yml \
              scripts/ \
              config/

          # 3. 上传到虚拟机家目录暂存区
          echo "📤 上传文件..."
          gcloud beta compute scp /tmp/app.tar.gz ${VM}:~/app.tar.gz --zone=${ZONE} --quiet

          # 4. 在 VM 上解压暂存区并调用部署脚本
          echo "🚀 开始主机供给与应用部署..."
          gcloud beta compute ssh ${VM} --zone=${ZONE} --quiet --command="
            set -e

            # 解压新版本到虚拟机家目录暂存区
            echo '📦 解压新版本到暂存区...'
            rm -rf ~/app
            mkdir -p ~/app
            tar -xzf ~/app.tar.gz -C ~/app
            rm -f ~/app.tar.gz

            # 委托 VM 端部署脚本执行全流程（含回滚）
            chmod +x ~/app/scripts/deploy/deploy-on-host.sh
            ~/app/scripts/deploy/deploy-on-host.sh
          "

          echo "✅ 部署完成（应急 VM: ${VM}）"
